[pytest]
# Where tests live and how they're discovered.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers let you run subsets, e.g. `pytest -m web` or `pytest -m "not mobile"`.
markers =
    web: web browser automation tests (Playwright)
    mobile: mobile/device automation tests (Appium)
    smoke: fast critical-path checks

# Default options:
#   --strict-markers  : fail if an unknown marker is used (catches typos)
#   -ra               : show a short summary of all non-passing outcomes
addopts =
    --strict-markers
    -ra
