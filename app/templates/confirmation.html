{% extends "base.html" %}
{% block title %}Order confirmed — Mini Retail{% endblock %}
{% block content %}
  <div class="confirmation" data-testid="order-confirmation">
    <h1>Thank you, {{ name }}!</h1>
    <p>Your order has been placed.</p>
    <p>Order ID: <strong data-testid="order-id">{{ order_id }}</strong></p>
    <a href="{{ url_for('index') }}" data-testid="back-to-shop">Back to shop</a>
  </div>
{% endblock %}
